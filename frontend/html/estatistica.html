<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas LTR701</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/auth.js"></script>
    <script>exigirLogin();</script>
    <link rel="stylesheet" href="../css/estatistica.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="top-bar">
        <div class="header-left"><h1>Dashboard LTR701</h1></div>
        <nav class="main-nav">
            <a href="index.html">Resposta (PID)</a>
            <a href="estatistica.html" class="active">Séries Históricas</a>
            <a href="sistema.html">Status e Logs</a>
            <a href="usuarios.html">Usuários</a>
        </nav>
    </header>

    <div class="container-estatisticas">
        <!-- Restauração a partir do banco: visível só para admin (estatistica.js) -->
        <section id="painel-restauracao" class="painel-restauracao" hidden>
            <h2>Restaurar série do banco de dados <small>(administrador)</small></h2>
            <div class="restauracao-campos">
                <label>De <input type="datetime-local" id="rest-de"></label>
                <label>Até <input type="datetime-local" id="rest-ate"></label>
                <label>Máx. de pontos <input type="number" id="rest-limite" value="5000" min="1" max="20000"></label>
                <button type="button" id="btn-restaurar">Restaurar</button>
                <button type="button" id="btn-local" class="btn-secundario">Série da simulação</button>
            </div>
            <p id="rest-msg" class="rest-msg"></p>
        </section>

        <!-- Cards Estatísticos Descritivos -->
        <section class="cards-grid">
            <div class="stat-card"><h3>Média</h3><p id="stat-media">--</p></div>
            <div class="stat-card"><h3>Variância</h3><p id="stat-var">--</p></div>
            <div class="stat-card"><h3>Desvio Padrão</h3><p id="stat-dp">--</p></div>
            <div class="stat-card"><h3>Assimetria</h3><p id="stat-assimetria">--</p></div>
            <div class="stat-card"><h3>Curtose (excesso)</h3><p id="stat-curtose">--</p></div>
            <div class="stat-card anomalias"><h3>Outliers</h3><p id="stat-outliers">--</p></div>
        </section>

        <!-- Gráfico de Histórico com Boxplot/Dispersão de Outliers -->
        <section class="grafico-historico">
            <h2>Série Histórica Completa</h2>
            <div class="canvas-wrapper"><canvas id="graficoHistorico"></canvas></div>
        </section>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/estatistica.js"></script>
</body>
</html>
