<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard LTR701</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/auth.js"></script>
</head>
<body>
    <div class="auth-wrap">
        <form class="auth-card" id="form-login" novalidate>
            <h1>Dashboard LTR701</h1>
            <p class="sub">Entre para acessar o sistema</p>

            <label>E-mail
                <input type="email" id="email" autocomplete="username" placeholder="exemplo@email.com" required>
            </label>
            <label>Senha
                <input type="password" id="senha" autocomplete="current-password" required>
            </label>

            <div id="msg" class="auth-msg"></div>
            <button type="submit" id="btn-entrar">Entrar</button>
            <p class="troca">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </form>
    </div>

    <script>
        if (getToken()) location.replace('index.html');   // já logado

        const msg = document.getElementById('msg');
        if (new URLSearchParams(location.search).get('cadastro') === 'ok') {
            msg.className = 'auth-msg ok';
            msg.textContent = 'Cadastro realizado! Faça login.';
        }

        document.getElementById('form-login').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('btn-entrar');
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            if (!email || !senha) {
                msg.className = 'auth-msg erro';
                msg.textContent = 'Preencha e-mail e senha.';
                return;
            }

            btn.disabled = true;
            msg.className = 'auth-msg';
            msg.textContent = 'Entrando...';
            try {
                const r = await apiFetch('/auth/login', { method: 'POST', body: { email, senha }, comAuth: false });
                salvarSessao(r.token, r.usuario);
                location.href = 'index.html';
            } catch (err) {
                msg.className = 'auth-msg erro';
                msg.textContent = err.message;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
